<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Rundan</title>
    <base href="/" />

    <meta name="theme-color" content="#0B84B3" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="img/rundan-mark.svg" />

    <!-- Rundan type pairing: Bricolage Grotesque (display) + Hanken Grotesk (text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap"
          rel="stylesheet" />

    <!-- Leaflet (maps) from CDN, free OpenStreetMap tiles, no API key -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <link rel="stylesheet" href="css/app.css" />
</head>

<body>
    <div id="app">
        <div class="app-loading">
            <img src="img/rundan-mark.svg" width="72" height="72" alt="Rundan" />
            <div class="spinner"></div>
            <p>Getting your people together…</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Something went wrong.
        <a href="" class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="js/vibrate.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
